<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Шарики и слоги - 6-й класс</title>
<style>
  :root {
    font-family:'Trebuchet MS',Arial,sans-serif;
    color:#394861;
    background:#eaf6fb;
  }
  * { box-sizing:border-box; }
  html,body {
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
  }
  .game {
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    background:#bdeaff url("fon.png") center/cover no-repeat;
    user-select:none;
    touch-action:manipulation;
  }
  .game.playing { cursor:pointer; }

  #balloon {
    position:absolute;
    z-index:3;
    width:clamp(145px,19vw,315px);
    height:clamp(205px,40vh,410px);
    left:50%;
    top:0;
    transform:translate(-50%,-110%);
    transform-origin:50% 75%;
    display:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    will-change:left,transform;
  }
  .picture {
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
  }

  .syllables {
    position:absolute;
    z-index:4;
    left:50%;
    bottom:5%;
    transform:translateX(-50%);
    display:flex;
    gap:12px;
    pointer-events:none;
  }
  .dot {
    width:clamp(14px,2vw,22px);
    aspect-ratio:1;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 7px #477e9955;
    opacity:.78;
    transition:background .2s,transform .2s;
  }
  .dot.on {
    background:#ffbd66;
    transform:scale(1.25);
    opacity:1;
  }

  .overlay {
    position:absolute;
    z-index:10;
    inset:0;
    display:grid;
    place-items:center;
    padding:20px;
    background:#e9f8ff9c;
    backdrop-filter:blur(3px);
    text-align:center;
  }
  .overlay[hidden] { display:none; }
  .panel {
    width:min(90%,510px);
    background:#fffdf6;
    padding:clamp(22px,4vw,40px);
    border-radius:32px;
    box-shadow:0 12px 36px #5484a34b;
    border:3px solid white;
  }
  h1 {
    margin:0 0 12px;
    font-size:clamp(27px,4vw,43px);
    color:#527a8e;
  }
  p {
    font-size:clamp(16px,2.1vw,22px);
    line-height:1.42;
    margin:0 0 25px;
  }
  button {
    font:inherit;
    font-size:clamp(19px,2.5vw,26px);
    font-weight:800;
    border:0;
    background:#ffbf74;
    color:#664c3a;
    border-radius:100px;
    padding:13px 38px;
    box-shadow:0 6px 0 #de9a53;
    cursor:pointer;
  }
  button:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 #de9a53;
  }
  .hint {
    position:absolute;
    z-index:5;
    top:14%;
    left:50%;
    transform:translateX(-50%);
    background:#ffffffd9;
    padding:7px 16px;
    border-radius:20px;
    font-size:clamp(15px,2vw,21px);
    white-space:nowrap;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s;
  }
  .hint.show { opacity:1; }

  @media(max-width:600px) {
    #balloon {
      width:180px;
      height:235px;
    }
  }
</style>
</head>
<body>
<main id="game" class="game" aria-label="Игра Шарики и слоги">
  <div id="hint" class="hint" aria-live="polite"></div>

  <div id="balloon" role="button" tabindex="0" aria-label="Нажми на шарик">
    <img id="picture" class="picture" alt="">
  </div>

  <div class="syllables" aria-hidden="true">
    <div id="dot1" class="dot"></div>
    <div id="dot2" class="dot"></div>
  </div>

  <div id="overlay" class="overlay">
    <section class="panel">
      <h1 id="panelTitle">Шарики и слоги</h1>
      <p id="panelText">
        Назови картинку по слогам. Нажми на шарик один раз на каждый слог.
        После двух нажатий он улетит!
      </p>
      <button id="start">Старт</button>
    </section>
  </div>
</main>

<script>
(() => {
  const cards = [
    {word:'бантик',  image:'gitkeep/bantik.png'},
    {word:'кактус',  image:'gitkeep/kaktus.png'},
    {word:'фонтан',  image:'gitkeep/fontan.png'},
    {word:'чайник',  image:'gitkeep/chaynik.png'},
    {word:'дельфин', image:'gitkeep/delfin.png'},
    {word:'бублик',  image:'gitkeep/bublik.png'},
    {word:'тюльпан', image:'gitkeep/tyulpan.png'},
    {word:'компас',  image:'gitkeep/kompas.png'},
    {word:'компот',  image:'gitkeep/kompot.png'},
    {word:'павлин',  image:'gitkeep/pavlin.png'},
    {word:'магнит',  image:'gitkeep/magnit.png'}
  ];

  const game = document.querySelector('#game');
  const balloon = document.querySelector('#balloon');
  const picture = document.querySelector('#picture');
  const overlay = document.querySelector('#overlay');
  const start = document.querySelector('#start');
  const hint = document.querySelector('#hint');
  const dots = [
    document.querySelector('#dot1'),
    document.querySelector('#dot2')
  ];

  let index = 0;
  let taps = 0;
  let phase = 'menu';

  let x = 0;
  let y = 0;
  let vx = 0;
  let vy = 0;
  let angle = 0;
  let spin = 0;

  let lastTime = 0;
  let raf = 0;
  let lastTap = 0;
  let hintTimer = 0;

  const height = () => game.clientHeight;
  const balloonHeight = () => balloon.offsetHeight;
  const floor = () =>
    height() - balloonHeight() * .82 - height() * .10;

  // Позиции шариков: центр, немного левее и немного правее.
  const lanes = [.50,.32,.68,.25,.75,.42,.60,.29,.71,.38,.63];

  function paint() {
    balloon.style.left = `calc(50% + ${x}px)`;
    balloon.style.transform =
      `translate(-50%, ${y}px) rotate(${angle}deg)`;
  }

  function showHint(message) {
    hint.textContent = message;
    hint.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.remove('show'), 1550);
  }

  function beginCard() {
    if (index >= cards.length) {
      finish();
      return;
    }

    taps = 0;
    dots.forEach(dot => dot.classList.remove('on'));

    const card = cards[index];
    picture.src = card.image;
    balloon.setAttribute(
      'aria-label',
      `Картинка: ${card.word}. Нажми два раза по слогам`
    );
    balloon.style.display = 'block';

    const limit = (game.clientWidth - balloon.offsetWidth) * .48;
    x = Math.max(
      -limit,
      Math.min(limit, (lanes[index] - .5) * game.clientWidth)
    );

    y = -balloonHeight() - 30;
    vx = 0;
    vy = 28;
    angle = 0;
    spin = 0;
    phase = 'fall';
    paint();
  }

  function finish() {
    phase = 'done';
    game.classList.remove('playing');
    balloon.style.display = 'none';
    document.querySelector('#panelTitle').textContent = 'Отлично!';
    document.querySelector('#panelText').textContent =
      'Все шарики улетели. Поиграем ещё?';
    start.textContent = 'Играть снова';
    overlay.hidden = false;
  }

  function tick(time) {
    if (!lastTime) lastTime = time;
    const dt = Math.min((time - lastTime) / 1000, .05);
    lastTime = time;

    if (phase === 'fall' || phase === 'bounce' || phase === 'fly') {
      x += vx * dt;
      vx *= Math.exp(-1.8 * dt);

      // Поворот после удара постепенно затухает.
      spin += (-angle * 17 - spin * 5.5) * dt;
      angle += spin * dt;

      const limit = (game.clientWidth - balloon.offsetWidth) * .48;
      if (x > limit) {
        x = limit;
        vx = -Math.abs(vx) * .35;
      }
      if (x < -limit) {
        x = -limit;
        vx = Math.abs(vx) * .35;
      }

      if (phase === 'fly') {
        vy = Math.max(vy - 480 * dt, -510);
        y += vy * dt;

        if (y < -balloonHeight() - 35) {
          index++;
          beginCard();
        }
      } else {
        vy = Math.min(vy + 270 * dt, 105);
        y += vy * dt;

        if (y >= floor()) {
          y = floor();
          vy = -72;
          if (taps === 0) {
            showHint('Назови картинку по слогам');
          }
        }

        // Сверху шарик не разворачиваем вниз.
        // После удара он доходит до вершины дуги естественно.
      }

      paint();
    }

    raf = requestAnimationFrame(tick);
  }

  function tap(event) {
    if (event) event.preventDefault();
    if (phase !== 'fall' && phase !== 'bounce') return;

    const now = performance.now();
    if (now - lastTap < 210) return;
    lastTap = now;

    const rect = balloon.getBoundingClientRect();

    const topHit = event && event.clientY != null
      && event.clientY < rect.top + rect.height * .38;

    const side = event && event.clientX != null
      ? Math.sign(rect.left + rect.width / 2 - event.clientX)
        || (index % 2 ? 1 : -1)
      : (index % 2 ? 1 : -1);

    // При ударе сверху почти нет движения вбок.
    // При ударе сбоку шарик отлетает в противоположную сторону.
    vx = topHit ? vx * .35 : side * (110 + Math.random() * 25);
    spin = topHit ? side * 35 : -side * (115 + Math.random() * 25);

    taps++;
    dots[taps - 1].classList.add('on');

    if (taps === 1) {
      phase = 'bounce';
      vy = topHit ? -245 : -230;
      y -= 5;
      paint();
      showHint('Ещё один слог!');
    } else {
      phase = 'fly';
      vy = -295;
      hint.classList.remove('show');
    }
  }

  balloon.addEventListener('pointerdown', tap);
  balloon.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') tap(event);
  });

  start.addEventListener('click', () => {
    cancelAnimationFrame(raf);
    lastTime = 0;
    lastTap = 0;
    index = 0;
    overlay.hidden = true;
    game.classList.add('playing');
    beginCard();
    raf = requestAnimationFrame(tick);
  });
})();
</script>
</body>
</html>
